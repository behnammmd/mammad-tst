:root[data-theme="dark"]{--bg:#121110;--surface:#1c1b18;--surface-2:#24221e;--surface-3:#2e2b26;--ink:#f3f0ea;--ink-2:#c6c0b5;--ink-3:#8e887d;--line:#34312b;--brand:#2dd4bf;--brand-2:#5eead4;--brand-soft:#123a36;--ok:#4ade80;--ok-soft:#14321f;--fix:#fbbf24;--fix-soft:#3a2c0d;--bad:#f87171;--bad-soft:#3b1616;--crit:#f87171;--high:#fb923c;--mid:#60a5fa;--norm:#94a3b8;--none:#78716c;--rout:#a78bfa;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);--shadow-2:0 10px 30px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px;line-height:1.85}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px}
/* top bar */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:10px;height:62px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#14b8a6);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.brand b{display:block;font-size:15.5px;line-height:1.4;white-space:nowrap}
.brand small{display:block;color:var(--ink-3);font-size:12px;line-height:1.3}
.search{flex:1;max-width:420px;margin-inline-start:auto;display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:40px}
.search input{border:0;background:transparent;outline:0;width:100%;min-width:0}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700;white-space:nowrap;display:flex;gap:6px;align-items:center}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.pill.on i{background:var(--ok)}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}
.ibtn:hover,.pill:hover{border-color:var(--brand)}
@media (max-width:760px){.brand{flex:1}.brand>div{min-width:0}.brand small{display:none}.brand b{font-size:14px;overflow:hidden;text-overflow:ellipsis}.bar-in{flex-wrap:wrap;height:auto;padding:8px 0;gap:8px}.search{order:5;max-width:none;flex-basis:100%;height:38px}.pill .lg{display:none}.ibtn{width:36px;height:36px}}
/* hero */
.hero{padding-top:18px}
.hero-in{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:12px 20px;align-items:center}
@media (max-width:760px){.hero-in{grid-template-columns:1fr}}
.howto{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.howto span{background:var(--surface-2);border-radius:10px;padding:3px 10px}
.howto b{color:var(--brand)}
.progress{min-width:min(100%,420px)}
.ptext{display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px;margin-bottom:6px}
.ptext b{font-weight:800}
.seg-bar{height:10px;border-radius:8px;background:var(--surface-3);overflow:hidden;display:flex}
.seg-bar i{display:block;height:100%;transition:width .5s}
.seg-bar .o{background:var(--ok)}.seg-bar .f{background:var(--fix)}
.other{font-size:12.5px;color:var(--ink-3);margin-top:5px}
.localnote{font-size:12.5px;color:var(--ink-3);grid-column:1/-1;border-top:1px dashed var(--line);padding-top:8px}
/* projects */
.projs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-top:14px}
@media (max-width:1100px){.projs{grid-template-columns:repeat(2,1fr)}}
.pc{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;text-align:start;display:flex;gap:10px;align-items:center;transition:.2s;box-shadow:var(--shadow)}
.pc:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.pc[aria-pressed="true"]{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc) inset,var(--shadow)}
.pc .pi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none;background:color-mix(in srgb,var(--pc) 16%,transparent)}
.pc b{display:block;font-size:14.5px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc small{display:block;color:var(--ink-3);font-size:12px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{--v:0;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--v)*1%),var(--surface-3) 0);display:grid;place-items:center;margin-inline-start:auto;flex:none}
.ring span{width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:10px;font-weight:800}
.match{position:absolute;top:-7px;left:-7px;background:var(--brand);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:0 7px;line-height:20px}
@media (max-width:760px){.projs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.pc{flex:0 0 215px;scroll-snap-align:start}}
/* project head */
main{padding:16px 0 80px}
.ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.ph-l{display:flex;gap:12px;align-items:center}
.pic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--pc) 16%,transparent)}
.ph h2{margin:0;font-size:24px;font-weight:900;line-height:1.3}
.ph-s{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-inline-start:6px}
.dot.crit{background:var(--crit)}.dot.high{background:var(--high)}.dot.mid{background:var(--mid)}.dot.rout{background:var(--rout)}
.edit{border:0;background:transparent;padding:0;color:var(--ink-2);font-size:13.5px;text-align:start}
.edit em{font-style:normal;opacity:0;transition:.2s;color:var(--brand);margin-inline-start:4px}
.edit:hover em,.sup:hover em{opacity:1}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;transition:.15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7;margin-inline-start:4px}
.tools-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn{border:0;background:var(--brand);color:#fff;border-radius:12px;padding:8px 16px;font-weight:800;font-size:14px}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--brand)}
/* board */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:16px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:0 0 310px;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;max-height:calc(100vh - 150px);scroll-snap-align:start;transition:.2s}
.col.drop{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset;background:var(--brand-soft)}
.col-h{padding:12px 12px 8px;border-bottom:1px solid var(--line)}
.col-t{display:flex;align-items:center;gap:8px}
.col-t b{font-size:15.5px;font-weight:900}
.cnt{margin-inline-start:auto;background:var(--surface);border-radius:999px;font-size:12px;font-weight:800;padding:0 9px;line-height:22px}
.sup{display:block;width:100%;border:0;background:transparent;text-align:start;padding:2px 0;font-size:13px;color:var(--ink-2);line-height:1.7}
.sup small{display:block;color:var(--fix);font-size:12px}
.sup em{font-style:normal;opacity:0;color:var(--brand);transition:.2s;margin-inline-start:4px}
.col-a{display:flex;gap:6px;margin-top:6px}
.mini{border:1px dashed var(--ink-3);background:transparent;border-radius:10px;padding:2px 10px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.mini:hover{border-color:var(--brand);color:var(--brand)}
.mini.ok:hover{border-color:var(--ok);color:var(--ok)}
.col-b{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:60px}
.empty{color:var(--ink-3);font-size:13px;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:12px}
.listv .col{flex:none;width:100%;max-height:none;margin-bottom:14px}
.listv{display:block}
.listv .col-b{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
/* card */
.card{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--pcol);border-radius:14px;padding:10px 12px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;outline:0}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.card.dragging{opacity:.4}
.card.flash{animation:flash 1.1s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--brand)}100%{box-shadow:var(--shadow)}}
.card h4{margin:6px 0 4px;font-size:14.5px;font-weight:700;line-height:1.7}
.p-crit{--pcol:var(--crit)}.p-high{--pcol:var(--high)}.p-mid{--pcol:var(--mid)}.p-norm{--pcol:var(--norm)}.p-none{--pcol:var(--none)}.p-rout{--pcol:var(--rout)}
.c-top{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pchip{font-size:11px;font-weight:800;border-radius:7px;padding:0 8px;line-height:20px;color:#fff;background:var(--pcol)}
.tg{font-size:11px;font-weight:700;border-radius:7px;padding:0 7px;line-height:20px;background:var(--surface-2);color:var(--ink-2)}
.tg.new{background:var(--brand-soft);color:var(--brand)}
.tg.ed{background:var(--fix-soft);color:var(--fix)}
.st{font-size:12px;font-weight:600}
.st.rd{color:var(--ok)}.st.wt{color:var(--ink-3)}.st.rt{color:var(--rout)}
.c-foot{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);min-width:0;flex:1}
.who i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.rbs{display:flex;gap:4px;align-items:center}
.rb{font-size:10.5px;font-weight:800;border-radius:7px;padding:0 6px;line-height:19px;background:var(--surface-2);color:var(--ink-3)}
.rb.ok{background:var(--ok-soft);color:var(--ok)}
.rb.fix{background:var(--fix-soft);color:var(--fix)}
.cm{font-size:13px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.38);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(600px,100vw);background:var(--surface);z-index:50;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow-2)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--pc) 10%,var(--surface))}
.crumb{flex:1;font-size:13px;color:var(--ink-2);min-width:0}
.tid{background:var(--surface-2);border-radius:6px;padding:0 6px;font-size:11.5px;margin-inline-start:4px;direction:ltr;display:inline-block}
.nav2{display:flex;gap:4px}
.nav2 button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:2px 10px;font-size:13px}
.db{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f>span{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.f textarea,.f input,.f select{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:8px 12px;outline:0;width:100%;resize:vertical;line-height:1.9;transition:border-color .15s,background .15s}
.f textarea:focus,.f input:focus,.f select:focus{border-color:var(--brand);background:var(--surface)}
.f textarea.title{font-size:17px;font-weight:800}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.row3,.row2{grid-template-columns:1fr}}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tagrow>span{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-inline-end:4px}
.tgl{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 12px;font-size:12.5px;font-weight:700}
.tgl.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.deps{display:flex;gap:6px;flex-wrap:wrap}
.dchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:3px 10px;font-size:13px;max-width:100%}
.dchip button{border:0;background:transparent;padding:0;color:var(--ink-3);font-size:13px}
.dchip .go{color:var(--ink);text-align:start}
.dchip .go:hover{color:var(--brand)}
.dchip .x:hover{color:var(--bad)}
.muted{color:var(--ink-3);font-size:13px}
.del{align-self:flex-start;border:0;background:transparent;color:var(--bad);font-size:13px;font-weight:700;padding:4px 0}
.dr{border-top:1px solid var(--line);padding:12px 16px 14px;background:var(--surface-2)}
.others{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;font-size:13px}
.others .o{display:flex;gap:6px;align-items:flex-start}
.dr textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;outline:0;min-height:44px;resize:vertical}
.dr textarea:focus{border-color:var(--brand)}
.rv-btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.okb,.fixb{flex:1;min-width:150px;border:2px solid var(--ok);background:var(--surface);color:var(--ok);border-radius:12px;padding:8px;font-weight:900;font-size:14.5px;transition:.15s}
.okb.on,.okb:hover{background:var(--ok);color:#fff}

.fixb.on,.fixb:hover{background:var(--fix);color:#fff}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
/* modal */
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(10,10,10,.42);padding:16px}
.modal.on{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbox{background:var(--surface);border-radius:20px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow-2)}
.mbox h3{margin:0 0 6px;font-size:18px;font-weight:900}
.mbox p{margin:0 0 12px;color:var(--ink-2);font-size:14px}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end}
.choice{display:flex;flex-direction:column;gap:8px}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:start;font-weight:800;font-size:15px;display:flex;gap:10px;align-items:center}
.choice button:hover{border-color:var(--brand)}
.choice small{display:block;font-weight:500;color:var(--ink-3);font-size:12.5px}
.msec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.msec h4{margin:0 0 6px;font-size:15px}
.mbtns{display:flex;gap:8px;flex-wrap:wrap}
.mbox label.cb{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.mbox select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 10px}
.rest{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0;font-size:13.5px}
/* toast */
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,120px);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;font-size:14px;z-index:70;transition:transform .3s;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-2);max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0)}
.toast button{border:0;background:transparent;color:var(--brand-2);font-weight:900}
.saved{position:fixed;bottom:16px;right:16px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--ok);box-shadow:var(--shadow);opacity:0;transition:opacity .3s;z-index:65;pointer-events:none}
.saved.on{opacity:1}
.burst{position:fixed;pointer-events:none;z-index:80;font-size:22px;animation:burst 1.2s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media print{.bar,.hero,.projs,.tools,.drawer,.scrim,.col-a,.saved,.toast{display:none!important}.board{display:block}.col{max-height:none;break-inside:avoid;margin-bottom:12px;width:100%}}
</style>

 </div>

function mergeIn(o){if(!o||!Array.isArray(o.tasks)||!Array.isArray(o.lists))throw 0;let add=0,upd=0,rv=0;
 (o.projects||[]).forEach(ip=>{const lp=P(ip.id);if(!lp)S.projects.push(ip);else if((ip.mt||0)>(lp.mt||0))Object.assign(lp,ip)});
 o.lists.forEach(il=>{const ll=L(il.id);if(!ll)S.lists.push(il);else if((il.mt||0)>(ll.mt||0))Object.assign(ll,il)});
 o.tasks.forEach(it=>{const lt=byId(it.id);if(!lt){S.tasks.push(it);add++;return}
  if((it.mt||0)>(lt.mt||0)){const keep=lt.rv;Object.assign(lt,it);lt.rv=keep;upd++}
  Object.keys(it.rv||{}).forEach(k=>{const a=it.rv[k],b=lt.rv[k];if(a&&(!b||(a.at||0)>(b.at||0))){lt.rv[k]=a;rv++}})});
 return {add,upd,rv}}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){const enc=new TextEncoder();const parts=[],cen=[];let off=0;
 for(const f of files){const nm=enc.encode(f.name),d=enc.encode(f.data),c=crc32(d);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
  parts.push(new Uint8Array(h.buffer),nm,d);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,c,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,nm.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
  cen.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+d.length}
 const cs=cen.reduce((s,a)=>s+a.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
const xe=s=>String(s??'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function composeDesc(t){const out=['مسئول: '+(t.person||'—')+(t.helper?' | همکار: '+t.helper:'')];
 if(t.pri!=='rout')out.push(deps(t).length?'وضعیت: منتظر تمام شدن پیش‌نیاز (پایین).':'وضعیت: همین حالا می‌شود شروع کرد.');
 if(t.note)out.push('نکته: '+t.note);
 const b=[];if(t.do)b.push('کار: '+t.do);if(t.why)b.push('چرا: '+t.why);if(t.done)b.push('تمام یعنی: '+t.done);
 if(b.length)out.push('',...b);if(t.body)out.push('',t.body);
 const d=deps(t);if(d.length)out.push('','قبل از این کار باید تمام شده باشد:',...d.map(x=>'• «'+byId(x).t+'» ('+x+')'));
 const n=dependents(t);if(n.length)out.push(d.length?'بعد از این کار، این‌ها شروع می‌شوند:':'\nبعد از این کار، این‌ها شروع می‌شوند:',...n.map(x=>'• «'+x.t+'» ('+x.id+')'));
 return out.join('\n')}
function sheetXml(rows){const H=['عنوان وظیفه','توضیحات وظیفه','برچسب ها','افراد','زمان وظیفه','عنوان لیست'];const col='ABCDEF';
 const cell=(r,c,v)=>v===''||v==null?'':`<c r="${col[c]}${r}" t="inlineStr"${r>1?' s="1"':''}><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
 const all=[H,...rows].map((row,i)=>`<row r="${i+1}">${row.map((v,c)=>cell(i+1,c,v)).join('')}</row>`).join('');
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><cols><col min="1" max="1" width="55" customWidth="1"/><col min="2" max="2" width="80" customWidth="1"/><col min="3" max="3" width="32" customWidth="1"/><col min="4" max="4" width="26" customWidth="1"/><col min="5" max="5" width="14" customWidth="1"/><col min="6" max="6" width="24" customWidth="1"/></cols><sheetData>${all}</sheetData></worksheet>`}
function xlsxBlob(rows){const NS='http://schemas.openxmlformats.org';return zip([
 {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
 {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
 {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets><sheet name="Example Import Spreadsheet" sheetId="1" r:id="rId1"/></sheets></workbook>`},
 {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
 {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment wrapText="1" vertical="top" horizontal="right"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
 {name:'xl/worksheets/sheet1.xml',data:sheetXml(rows)}])}
function rowsFor(pid,mode){const ls=S.lists.filter(l=>l.p===pid).map(l=>l.id);
 const okm=t=>mode==='all'||(mode==='any'?(rvs(t,'ceo')==='ok'||rvs(t,'coo')==='ok'):(rvs(t,'ceo')==='ok'&&rvs(t,'coo')==='ok'));
 return T().filter(t=>t.p===pid&&okm(t)).sort((a,b)=>ls.indexOf(a.l)-ls.indexOf(b.l)||sortTasks(a,b)).map(t=>[t.t,composeDesc(t),[PRI[t.pri].l,...t.tags].join(','),t.person||'','',(L(t.l)||{}).n||''])}
function exportXlsx(pids,mode){let n=0,i=0;const go=()=>{if(i>=pids.length){toast(n?fa(n)+' فایل اکسل ساخته شد':'وظیفه‌ای با این شرط نبود');return}const pid=pids[i++];const p=P(pid);const rows=rowsFor(pid,mode);
 if(rows.length){const idx=S.projects.indexOf(p)+1;download(xlsxBlob(rows),`${String(idx).padStart(2,'0')} - پاییز ۱۴۰۵ - ${p.n}.xlsx`);n++}setTimeout(go,450)};go()}

renderAll();
if(!S.reviewer)setTimeout(pickWho,400);
